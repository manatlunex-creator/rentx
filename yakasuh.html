<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentX - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Custom Bildiriş -->
    <div id="custom-alert">Bildiriş mesajı</div>

    <!-- Login Ekranı -->
    <div id="admin-login" class="container" style="margin-top: 100px; max-width: 400px;">
        <div class="card">
            <h2 style="color: var(--primary-red); text-align: center; margin-bottom: 15px;">Admin Girişi</h2>
            <input type="text" id="admin-user" placeholder="İstifadəçi adı">
            <input type="password" id="admin-pass" placeholder="Şifrə">
            <button onclick="checkAdminLogin()" class="neon-btn">Daxil Ol</button>
        </div>
    </div>

    <!-- Admin Panel Kontent -->
    <div id="admin-dashboard" class="container" style="display: none; padding-bottom: 50px;">
        <h1 style="color: var(--primary-red); margin-bottom: 20px;">RentX Admin Panel</h1>
        
        <!-- Statistika -->
        <div class="card">
            <h3>Statistika</h3>
            <p>Ümumi Gələn Pul (Depozit): <span id="stat-income" style="color: #00ff00;">0 ₼</span></p>
            <p>Ümumi Çıxan Pul: <span id="stat-outcome" style="color: var(--primary-red);">0 ₼</span></p>
        </div>

        <!-- İstifadəçilər Siyahısı -->
        <div class="card">
            <h3>Qeydiyyatdan Keçən İstifadəçilər</h3>
            <div id="admin-users-list" style="margin-top: 10px;"></div>
        </div>

        <!-- Rəsmi RentX Elan Yerləşdir (Admin) -->
        <div class="card">
            <h3>Rəsmi RentX Elanı Yerləşdir</h3>
            <form id="admin-ad-form">
                <select id="admin-ad-game" required>
                    <option value="PUBG Mobile">PUBG Mobile</option>
                </select>
                <select id="admin-ad-duration" required>
                    <option value="Saatlıq">Saatlıq</option>
                    <option value="Günlük">Günlük</option>
                    <option value="Həftəlik">Həftəlik</option>
                </select>
                <input type="number" id="admin-ad-price" placeholder="Qiymət (AZN)" required>
                <textarea id="admin-ad-notes" placeholder="Hesab məlumatları" required></textarea>
                <input type="file" id="admin-ad-file" accept="image/*" required style="padding: 8px; margin-bottom: 10px;">
                <button type="submit" class="neon-btn">Rəsmi Elan Paylaş (RentX)</button>
            </form>
        </div>

        <!-- Kart İdarəetməsi (Maksimum 5) -->
        <div class="card">
            <h3>Depozit Kartları (Maks: 5)</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="new-card-title" placeholder="Məs: Kapital Bank: 4169 ... 8821" style="margin-bottom:0;">
                <button onclick="addNewCard()" class="neon-btn" style="width: 150px;">Əlavə Et</button>
            </div>
            <div id="admin-cards-list" style="margin-top: 15px;"></div>
        </div>

        <!-- Balans Sorğuları -->
        <div class="card">
            <h3>Depozit Sorğuları</h3>
            <div id="admin-deposits"></div>
        </div>

        <!-- Çıxarış Sorğuları -->
        <div class="card">
            <h3>Çıxarış Sorğuları</h3>
            <div id="admin-withdrawals"></div>
        </div>

        <!-- Elan Təsdiqləri -->
        <div class="card">
            <h3>Elan Təsdiqləri</h3>
            <div id="admin-ads"></div>
        </div>

        <!-- Dəstək Sorğuları -->
        <div class="card">
            <h3>Dəstək Mesajları</h3>
            <div id="admin-support"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://rentx-8849b-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showCustomAlert(text) {
            let alertBox = document.getElementById('custom-alert');
            alertBox.innerText = text;
            alertBox.classList.add('show');
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3000);
        }

        function checkAdminLogin() {
            let u = document.getElementById('admin-user').value;
            let p = document.getElementById('admin-pass').value;

            if(u === 'K9ESCOBAR211_' && p === 'SSAH_6789$_1') {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadAdminData();
            } else {
                showCustomAlert('İstifadəçi adı və ya şifrə səhvdir!');
            }
        }

        // Admin rəsmi elan paylaşma məntiqi
        document.getElementById('admin-ad-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let fileInput = document.getElementById('admin-ad-file');
            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let adId = Math.floor(100000 + Math.random() * 900000);
                    let adData = {
                        id: adId,
                        userId: 'admin_official',
                        userName: 'RentX (Rəsmi)',
                        game: document.getElementById('admin-ad-game').value,
                        durationType: document.getElementById('admin-ad-duration').value,
                        price: document.getElementById('admin-ad-price').value,
                        notes: document.getElementById('admin-ad-notes').value,
                        image: event.target.result,
                        status: 'Elan əlavə edildi',
                        views: 0,
                        date: new Date().toLocaleString()
                    };
                    db.ref('ads/' + adId).set(adData).then(() => {
                        showCustomAlert('Rəsmi RentX elanı uğurla paylaşıldı!');
                        document.getElementById('admin-ad-form').reset();
                    });
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        });

        function loadAdminData() {
            // İstifadəçiləri yüklə və göstər
            db.ref('users').on('value', snapshot => {
                let container = document.getElementById('admin-users-list');
                container.innerHTML = '';
                let users = snapshot.val();
                if(users) {
                    Object.entries(users).forEach(([id, u]) => {
                        container.innerHTML += `
                            <div style="background:#1a1a1a; padding:8px 12px; margin-top:6px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                                <span><b>Ad:</b> ${u.name || 'Naməlum'} | <b>Balans:</b> ₼ ${(u.balance || 0).toFixed(2)}</span>
                                <span style="font-size:11px; color:#aaa;">ID: ${id}</span>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="color:#aaa; font-size:12px;">Hələ qeydiyyatdan keçən istifadəçi yoxdur.</p>';
                }
            });

            db.ref('admin_cards').on('value', snapshot => {
                let container = document.getElementById('admin-cards-list');
                container.innerHTML = '';
                let cards = snapshot.val();
                window.currentCardCount = cards ? Object.keys(cards).length : 0;
                
                if(cards) {
                    Object.entries(cards).forEach(([id, card]) => {
                        container.innerHTML += `
                            <div style="background:#1a1a1a; padding:8px 12px; margin-top:6px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                                <span>${card.title}</span>
                                <button onclick="deleteCard('${id}')" style="background:red; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Sil</button>
                            </div>
                        `;
                    });
                }
            });

            db.ref('deposits').on('value', snapshot => {
                let container = document.getElementById('admin-deposits');
                container.innerHTML = '';
                let totalIncome = 0;
                snapshot.forEach(child => {
                    let dep = child.val();
                    if(dep.status === 'Uğurla balansa əlavə olundu') totalIncome += dep.amount;
                    container.innerHTML += `
                        <div style="background:#1a1a1a; padding:10px; margin-top:8px; border-radius:6px;">
                            <p><b>${dep.userName}</b> - ${dep.amount} AZN (Kart: ${dep.cardUsed || 'N/A'})</p>
                            <p>Qəbz: ${dep.receipt} | Status: ${dep.status}</p>
                            ${dep.status === 'Gözləmədədir' ? `
                                <button onclick="updateDeposit('${dep.id}', '${dep.userId}', ${dep.amount}, 'Uğurla balansa əlavə olundu')" style="background:green; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer; margin-top:5px;">Təsdiq Et</button>
                                <button onclick="updateDepositStatus('${dep.id}', 'Ləğv edildi')" style="background:red; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer; margin-top:5px;">Ləğv Et</button>
                            ` : ''}
                        </div>
                    `;
                });
                document.getElementById('stat-income').innerText = totalIncome + ' ₼';
            });

            db.ref('withdrawals').on('value', snapshot => {
                let container = document.getElementById('admin-withdrawals');
                container.innerHTML = '';
                let totalOutcome = 0;
                snapshot.forEach(child => {
                    let w = child.val();
                    if(w.status === 'Uğurlu') totalOutcome += w.amount;
                    container.innerHTML += `
                        <div style="background:#1a1a1a; padding:10px; margin-top:8px; border-radius:6px;">
                            <p><b>${w.userName}</b> - ${w.amount} AZN (Kart: ${w.card})</p>
                            <p>Status: ${w.status}</p>
                            ${w.status === 'Emal edilir' ? `
                                <button onclick="approveWithdrawal('${w.id}', '${w.userId}', ${w.amount})" style="background:green; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer; margin-top:5px;">Ödə</button>
                                <button onclick="updateWithdrawStatus('${w.id}', 'Ləğv edildi')" style="background:red; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer; margin-top:5px;">Ləğv Et</button>
                            ` : ''}
                        </div>
                    `;
                });
                document.getElementById('stat-outcome').innerText = totalOutcome + ' ₼';
            });

            db.ref('ads').on('value', snapshot => {
                let container = document.getElementById('admin-ads');
                container.innerHTML = '';
                snapshot.forEach(child => {
                    let ad = child.val();
                    container.innerHTML += `
                        <div style="background:#1a1a1a; padding:10px; margin-top:8px; border-radius:6px;">
                            <p><b>Elan №: ${ad.id}</b> | ${ad.game} - ${ad.price} AZN</p>
                            <p style="font-size:12px; color:#aaa;">${ad.notes}</p>
                            <p>Status: ${ad.status}</p>
                            ${ad.status === 'Elan baxışdadır' ? `
                                <button onclick="updateAdStatus(${ad.id}, 'Elan əlavə edildi')" style="background:green; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer; margin-top:5px;">Təsdiq Et</button>
                                <button onclick="updateAdStatus(${ad.id}, 'Elan ləğv edildi')" style="background:red; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer; margin-top:5px;">Ləğv Et</button>
                            ` : ''}
                        </div>
                    `;
                });
            });

            db.ref('support').on('value', snapshot => {
                let container = document.getElementById('admin-support');
                container.innerHTML = '';
                snapshot.forEach(child => {
                    let s = child.val();
                    container.innerHTML += `
                        <div style="background:#1a1a1a; padding:10px; margin-top:8px; border-radius:6px;">
                            <p><b>[${s.category}] ${s.userName}:</b> ${s.message}</p>
                            <input type="text" id="reply_${s.id}" placeholder="Cavab yaz..." style="margin-top:5px;">
                            <button onclick="replySupport('${s.id}')" style="background:var(--primary-red); color:white; border:none; padding:5px; border-radius:4px; cursor:pointer;">Cavabla</button>
                        </div>
                    `;
                });
            });
        }

        function addNewCard() {
            let cardTitle = document.getElementById('new-card-title').value.trim();
            if(!cardTitle) {
                showCustomAlert('Kart məlumatını daxil edin!');
                return;
            }
            if(window.currentCardCount >= 5) {
                showCustomAlert('Maksimum 5 kart əlavə edə bilərsiniz!');
                return;
            }
            let cardId = 'card_' + Date.now();
            db.ref('admin_cards/' + cardId).set({
                id: cardId,
                title: cardTitle
            }).then(() => {
                document.getElementById('new-card-title').value = '';
                showCustomAlert('Kart uğurla əlavə olundu!');
            });
        }

        function deleteCard(cardId) {
            if(confirm('Bu kartı silmək istədiyinizə əminsiniz?')) {
                db.ref('admin_cards/' + cardId).remove();
            }
        }

        function updateDeposit(depId, userId, amount, status) {
            db.ref('deposits/' + depId + '/status').set(status);
            db.ref('users/' + userId + '/balance').transaction(current => (current || 0) + amount);
        }

        function updateDepositStatus(depId, status) {
            db.ref('deposits/' + depId + '/status').set(status);
        }

        function updateWithdrawStatus(withId, status) {
            db.ref('withdrawals/' + withId + '/status').set(status);
        }

        function approveWithdrawal(withId, userId, amount) {
            db.ref('users/' + userId + '/balance').once('value', snapshot => {
                let currentBal = snapshot.val() || 0;
                if(currentBal >= amount) {
                    db.ref('users/' + userId + '/balance').set(currentBal - amount);
                    db.ref('withdrawals/' + withId + '/status').set('Uğurlu');
                } else {
                    showCustomAlert('İstifadəçinin balansında kifayət qədər vəsait yoxdur!');
                }
            });
        }

        function updateAdStatus(adId, status) {
            db.ref('ads/' + adId + '/status').set(status);
        }

        function replySupport(ticId) {
            let replyText = document.getElementById('reply_' + ticId).value;
            db.ref('support/' + ticId).update({
                reply: replyText,
                status: 'Cavab verildi'
            });
            showCustomAlert('Cavab göndərildi!');
        }
    </script>
</body>
</html>
